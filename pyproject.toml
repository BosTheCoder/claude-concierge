[project]
name = "claude-concierge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge"]

[tool.pytest.ini_options]
pythonpath = ["."]
