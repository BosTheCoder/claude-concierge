<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Chats</title>
<meta name="theme-color" content="#14161a">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1b1d21; --mute:#6b6f76; --line:#e6e3dd; --red:#d93025; --blue:#1a73e8; --chip:#efede8; color-scheme:light }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --ink:#eceae6; --mute:#9aa0a8; --line:#2c3038; --red:#ff6b5e; --blue:#8ab4f8; --chip:#272b32; color-scheme:dark }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, sans-serif }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 16px 8px; border-bottom:1px solid var(--line) }
  h1 { margin:0 0 8px; font-size:20px }
  .bar { display:flex; gap:8px }
  select, input[type=search] { min-height:44px; border:1px solid var(--line); border-radius:12px; background:var(--card);
    color:inherit; font:inherit; padding:0 12px; min-width:0 }
  select { flex:1 1 55% } input[type=search] { flex:1 1 45% }
  main { max-width:720px; margin:0 auto; padding:8px 16px 48px }
  .msg { color:var(--mute); padding:16px 0 } .msg.bad { color:var(--red) }
  .t { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:8px 0; overflow:hidden }
  .t > button { all:unset; box-sizing:border-box; display:flex; gap:10px; width:100%; padding:12px 14px; cursor:pointer; align-items:flex-start }
  .t > button:focus-visible { outline:2px solid var(--blue); outline-offset:-2px }
  .ti { flex:1; min-width:0; overflow-wrap:anywhere }
  .meta { display:block; font-size:13px; color:var(--mute); margin-top:2px }
  .dot { flex:none; font-size:13px; font-weight:700; color:var(--blue); padding-top:2px }
  .body { display:none; padding:0 14px 14px; border-top:1px solid var(--line) }
  .t.open .body { display:block }
  .content { white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; color:var(--mute); max-height:40vh; overflow:auto; margin:10px 0 }
  .subs { margin:8px 0; padding-left:20px; font-size:14px }
  textarea { width:100%; min-height:72px; border:1px solid var(--line); border-radius:12px; background:var(--bg);
    color:inherit; font:inherit; padding:10px 12px; resize:vertical }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px }
  .btn { min-height:44px; padding:0 18px; border-radius:22px; border:0; background:var(--blue); color:var(--bg);
    font:inherit; font-weight:600; display:inline-flex; align-items:center; text-decoration:none; cursor:pointer }
  .btn:disabled { opacity:.5 }
  .link { color:var(--blue); font-size:14px; text-decoration:none; padding:12px 4px }
  .status { font-size:14px; color:var(--mute) } .status.bad { color:var(--red) }
</style>
</head>
<body>
<header>
  <h1>Task chats</h1>
  <div class="bar">
    <select id="list" aria-label="TickTick list"><option value="chats">✦ With a chat</option></select>
    <input id="q" type="search" placeholder="Filter" aria-label="Filter tasks">
  </div>
</header>
<main id="out"><p class="msg">Loading lists…</p></main>
<script>
// One Claude Code chat per TickTick task. The first tap starts it; every later tap opens the same
// chat, resumed if the concierge closed it. Server: claude-concierge dashboard (taskchats.py).
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {get: k => { try { return localStorage.getItem(k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
let lists = [], tasks = [], chats = {}, openId = null, polling = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || `error ${r.status}`);
  return j;
}
const listName = id => (lists.find(l => l.id === id) || {}).name || "";
const due = d => d ? new Date(d).toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"}) : "";

function action(t) {
  const c = chats[t.id];
  if (c && c.rc_url) return `<a class="btn" href="${esc(c.rc_url)}" target="_blank" rel="noopener" data-resume="${esc(t.id)}">Open chat ›</a>
    <span class="status">${c.live ? "running" : "will resume as you open it"}</span>`;
  if (c) return `<button class="btn" data-start="${esc(t.id)}">Reopen chat</button><span class="status" id="st-${esc(t.id)}">Starting…</span>`;
  return `<textarea id="note-${esc(t.id)}" placeholder="What should it do? (optional)" aria-label="Note for Claude"></textarea>
    <div class="row"><button class="btn" data-start="${esc(t.id)}">Start chat</button><span class="status" id="st-${esc(t.id)}"></span></div>`;
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const shown = tasks.filter(t => !q || (t.title + " " + (t.content || "")).toLowerCase().includes(q));
  if (!shown.length) { $("#out").innerHTML = `<p class="msg">${$("#list").value === "chats" ? "No task has a chat yet. Pick a list and start one." : "Nothing open here."}</p>`; return; }
  $("#out").innerHTML = shown.map(t => {
    const c = chats[t.id];
    const meta = [due(t.dueDate), t.subtasks?.length ? `${t.subtasks.length} subtasks` : "", t.list].filter(Boolean).join(" · ");
    const tt = t.projectId ? `<a class="link" href="https://ticktick.com/webapp/#p/${esc(t.projectId)}/tasks/${esc(t.id)}" target="_blank" rel="noopener">TickTick ›</a>` : "";
    return `<div class="t${openId === t.id ? " open" : ""}" id="t-${esc(t.id)}">
      <button aria-expanded="${openId === t.id}" data-toggle="${esc(t.id)}"><span class="ti">${esc(t.title)}<span class="meta">${esc(meta)}</span></span>${c ? '<span class="dot">✦ chat</span>' : ""}</button>
      <div class="body">${t.content || t.desc ? `<div class="content">${esc((t.content || t.desc).slice(0, 2000))}</div>` : ""}
        ${t.subtasks?.length ? `<ul class="subs">${t.subtasks.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
        <div class="row">${action(t)}</div><div class="row">${tt}</div></div></div>`;
  }).join("");
}

async function loadChats() { chats = (await api("api/tt/chats")).chats || {}; }

async function show() {
  const id = $("#list").value;
  store.set("tc-list", id);
  $("#out").innerHTML = `<p class="msg">Loading…</p>`;
  try {
    await loadChats();
    tasks = id === "chats"
      ? Object.entries(chats).map(([tid, c]) => ({id: tid, title: c.title}))
      : ((await api(`api/tt/tasks?list=${encodeURIComponent(id)}`)).tasks || []);
    render();
  } catch (e) { $("#out").innerHTML = `<p class="msg bad">Couldn't load: ${esc(e.message)}</p>`; }
}

async function start(id) {
  const btn = document.querySelector(`[data-start="${id}"]`), st = $(`#st-${id}`);
  btn.disabled = true; st.className = "status"; st.textContent = "Starting…";
  try {
    const t = tasks.find(x => x.id === id) || {};
    const r = await api("api/task-chat", {task_id: id, list: t.list || listName($("#list").value), note: $(`#note-${id}`)?.value || ""});
    chats[id] = {job: r.id, rc_url: r.rc_url, title: t.title, live: true};
    if (!r.rc_url) waitForLink(id);
    render();
  } catch (e) { st.className = "status bad"; st.textContent = `Didn't start: ${e.message}`; btn.disabled = false; }
}

// The chat's link appears a few seconds after it starts. Then the button becomes "Open chat".
function waitForLink(id, tries = 0) {
  clearTimeout(polling);
  polling = setTimeout(async () => {
    try { await loadChats(); } catch {}
    if (chats[id]?.rc_url || tries > 30) render(); else waitForLink(id, tries + 1);
  }, 2000);
}

document.addEventListener("click", e => {
  const tog = e.target.closest("[data-toggle]");
  if (tog) { openId = openId === tog.dataset.toggle ? null : tog.dataset.toggle; render(); return; }
  const st = e.target.closest("[data-start]");
  if (st) { start(st.dataset.start); return; }
  const res = e.target.closest("[data-resume]");
  // The link opens straight away; this brings the session back if the concierge closed it.
  if (res) fetch("api/task-chat", {method: "POST", keepalive: true, headers: {"Content-Type": "application/json"},
    body: JSON.stringify({task_id: res.dataset.resume, list: "", note: ""})}).catch(() => {});
});
$("#list").onchange = show;
$("#q").oninput = render;

(async () => {
  try {
    lists = (await api("api/tt/lists")).lists || [];
    $("#list").insertAdjacentHTML("beforeend", lists.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join(""));
    const saved = store.get("tc-list");
    $("#list").value = [...$("#list").options].some(o => o.value === saved) ? saved : "inbox";
  } catch (e) { $("#out").innerHTML = `<p class="msg bad">Couldn't load your lists: ${esc(e.message)}</p>`; return; }
  show();
})();
</script>
</body>
</html>
