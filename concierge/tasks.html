<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Chats</title>
<meta name="theme-color" content="#14161a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="search.js"></script>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1b1d21; --mute:#6b6f76; --line:#e6e3dd; --red:#d93025; --orange:#e8710a; --blue:#1a73e8; --chip:#efede8; color-scheme:light }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --ink:#eceae6; --mute:#9aa0a8; --line:#2c3038; --red:#ff6b5e; --orange:#ffa04d; --blue:#8ab4f8; --chip:#272b32; color-scheme:dark }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, sans-serif }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 16px 8px; border-bottom:1px solid var(--line) }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:8px }
  h1 { margin:0; font-size:20px; flex:1 }
  .icon { width:44px; height:44px; border-radius:22px; border:1px solid var(--line); background:var(--card); color:inherit; font-size:20px; cursor:pointer }
  input[type=search] { width:100%; min-height:44px; border:1px solid var(--line); border-radius:12px; background:var(--card);
    color:inherit; font:inherit; padding:0 12px }
  .tabs { display:flex; gap:6px; margin-top:8px }
  .tabs button { flex:1; min-height:40px; border-radius:20px; border:0; background:var(--chip); color:inherit; font:inherit; font-size:15px; cursor:pointer }
  .tabs button[aria-pressed=true] { background:var(--blue); color:var(--bg); font-weight:600 }
  main { max-width:720px; margin:0 auto; padding:4px 16px 48px }
  .msg { color:var(--mute); padding:12px 0; font-size:14px } .msg.bad { color:var(--red) }
  .t { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:8px 0; overflow:hidden }
  .t > button { all:unset; box-sizing:border-box; display:flex; gap:10px; width:100%; padding:12px 14px; cursor:pointer; align-items:flex-start }
  .t > button:focus-visible { outline:2px solid var(--blue); outline-offset:-2px }
  .t.sub { margin-left:20px }
  .p { flex:none; width:4px; align-self:stretch; border-radius:2px; background:var(--line) }
  .p5 { background:var(--red) } .p3 { background:var(--orange) } .p1 { background:var(--blue) }
  .ti { flex:1; min-width:0; overflow-wrap:anywhere }
  .meta { display:block; font-size:13px; color:var(--mute); margin-top:2px }
  .meta .late { color:var(--red) }
  .dot { flex:none; font-size:13px; font-weight:700; color:var(--blue); padding-top:2px }
  .body { display:none; padding:0 14px 14px; border-top:1px solid var(--line) }
  .t.open .body { display:block }
  .content { overflow-wrap:anywhere; font-size:15px; max-height:50vh; overflow:auto; margin:10px 0 }
  .content.raw { white-space:pre-wrap }
  .content :first-child { margin-top:0 } .content :last-child { margin-bottom:0 }
  .content h1, .content h2, .content h3 { font-size:16px; margin:12px 0 4px }
  .content p, .content ul, .content ol { margin:6px 0 } .content ul, .content ol { padding-left:22px }
  .content a { color:var(--blue) } .content code { background:var(--chip); padding:0 4px; border-radius:4px; font-size:13px }
  .content pre { background:var(--chip); padding:8px; border-radius:8px; overflow:auto }
  .content blockquote { margin:6px 0; padding-left:10px; border-left:3px solid var(--line); color:var(--mute) }
  .content img { max-width:100% } .content table { border-collapse:collapse } .content td, .content th { border:1px solid var(--line); padding:2px 6px }
  textarea.edit { min-height:40vh; font:14px/1.45 ui-monospace, monospace }
  .ctl { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px }
  .ctl .lbl { font-size:13px; color:var(--mute); width:100% }
  .chip { min-height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--line); background:var(--bg); color:inherit; font:inherit; font-size:15px; cursor:pointer }
  .chip[aria-pressed=true] { background:var(--ink); color:var(--bg); border-color:var(--ink) }
  .chip:disabled { opacity:.5 }
  .chip.p5 { color:var(--red) } .chip.p3 { color:var(--orange) } .chip.p1 { color:var(--blue) }
  .chip[aria-pressed=true].p5, .chip[aria-pressed=true].p3, .chip[aria-pressed=true].p1 { color:var(--bg) }
  input[type=date] { min-height:40px; border:1px solid var(--line); border-radius:20px; background:var(--bg); color:inherit; font:inherit; font-size:15px; padding:0 10px }
  .flash { background:var(--chip); border-radius:12px; padding:10px 14px; margin:8px 0; font-size:14px }
  .subs { margin:8px 0; padding-left:20px; font-size:14px }
  textarea { width:100%; min-height:72px; border:1px solid var(--line); border-radius:12px; background:var(--bg);
    color:inherit; font:inherit; padding:10px 12px; resize:vertical }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px }
  .btn { min-height:44px; padding:0 18px; border-radius:22px; border:0; background:var(--blue); color:var(--bg);
    font:inherit; font-weight:600; display:inline-flex; align-items:center; text-decoration:none; cursor:pointer }
  .btn:disabled { opacity:.5 }
  .link { color:var(--blue); font-size:14px; text-decoration:none; padding:12px 4px }
  .status { font-size:14px; color:var(--mute) } .status.bad { color:var(--red) }
  details.help { font-size:13px; color:var(--mute); margin-top:6px } details.help code { background:var(--chip); padding:0 4px; border-radius:4px }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Task chats</h1><button class="icon" id="reload" aria-label="Refresh from TickTick">↻</button></div>
  <input id="q" type="search" placeholder="Search all tasks, or paste a TickTick link" aria-label="Search all tasks, or paste a TickTick link">
  <div class="tabs" role="group" aria-label="View">
    <button data-view="today" aria-pressed="true">Today</button>
    <button data-view="next" aria-pressed="false">Next</button>
    <button data-view="chats" aria-pressed="false">✦ Chats</button>
  </div>
  <details class="help"><summary>Search like Tickfind</summary>
    Every word must match; one typo is forgiven if nothing matches exactly. <code>#tag</code> <code>~list</code> <code>-~list</code>
    <code>!high</code> <code>!med</code> <code>!low</code> <code>due:today</code> <code>due:overdue</code> <code>due:week</code> <code>due:none</code>
    <code>is:note</code> <code>-word</code> <code>"a phrase"</code> <code>a | b</code> (either) <code>sort:due</code> <code>sort:best</code></details>
</header>
<main id="out"><p class="msg">Loading your tasks…</p></main>
<script>
// One Claude Code chat per TickTick task. Today and Next mirror his TickTick filters; search mirrors Tickfind.
// First tap starts the task's chat; later taps open the same chat, resumed if the concierge closed it.
// Server: claude-concierge dashboard (taskchats.py, ticktick.py).
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {get: k => { try { return localStorage.getItem(k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
let views = {}, all = [], byId = {}, chats = {}, view = store.get("tc-view") || "today", openId = null, polling = null, linked = null;
let editing = null, busy = false, flash = "";  // editing = {id, text}: survives re-renders while he types

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || `error ${r.status}`);
  return j;
}

// --- dates: an all-day task's date is in its own time zone, a timed one in the phone's ---
const ymd = (d, tz) => new Intl.DateTimeFormat("en-CA", {timeZone: tz || undefined, year: "numeric", month: "2-digit", day: "2-digit"}).format(d);
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
function dueDay(t) {
  if (!t.dueDate) return null;
  const d = new Date(t.dueDate.replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
  try { return ymd(d, t.isAllDay ? t.timeZone : undefined); } catch { return ymd(d); }
}
function dueText(t) {
  const d = dueDay(t); if (!d) return "";
  const late = d < today();
  const label = d === today() ? "Today" : d === addDays(1) ? "Tomorrow"
    : new Date(d + "T12:00").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"});
  return late ? `<span class="late">${label}</span>` : label;
}
const byPriority = (a, b) => (b.priority || 0) - (a.priority || 0) || (dueDay(a) || "9").localeCompare(dueDay(b) || "9");
const stamp = s => s ? Date.parse(s.replace(/([+-]\d\d)(\d\d)$/, "$1:$2")) || 0 : 0;
// Search and the Today / Next views are Tickfind's search (search.js, checked against tickfind/tests/search-cases.json);
// the views' queries are his rules in ticktick-core (rules.toml), sent with the tasks.
const search = (text, sort) => TickSearch.run(all, text, {today: today(), sort});

// --- what is on screen ---
function linkedId(text) { const m = text.match(/ticktick\.com\/\S*?tasks\/([0-9a-f]{24})/i); return m && m[1]; }
function visible() {
  const q = $("#q").value.trim();
  const id = linkedId(q);
  if (id) return byId[id] ? [byId[id]] : linked && linked.id === id ? [linked] : [];
  if (q) return search(q).slice(0, 100);
  if (view === "chats") return Object.entries(chats).map(([id, c]) => byId[id] || {id, title: c.title, closed: true});
  // Like TickTick: a matching task brings its open subtasks with it, listed under it.
  const hit = views[view] ? search(views[view]) : [], ids = new Set(hit.map(t => t.id)), out = [];
  for (const t of hit.filter(t => !ids.has(t.parentId)).sort(byPriority)) {
    out.push(t);
    const kids = all.filter(x => x.parentId === t.id).sort(byPriority);
    for (const k of kids) out.push({...k, sub: true});
  }
  return out;
}

function action(t) {
  const c = chats[t.id];
  if (c && c.rc_url) return `<a class="btn" href="${esc(c.rc_url)}" target="_blank" rel="noopener" data-resume="${esc(t.id)}">Open chat ›</a>
    <span class="status">${c.live ? "running" : "resumes as you open it"}</span>`;
  if (c) return `<button class="btn" data-start="${esc(t.id)}">Reopen chat</button><span class="status" id="st-${esc(t.id)}">Starting…</span>`;
  return `<textarea id="note-${esc(t.id)}" placeholder="What should it do? (optional)" aria-label="Note for Claude"></textarea>
    <div class="row"><button class="btn" data-start="${esc(t.id)}">Start chat</button><span class="status" id="st-${esc(t.id)}"></span></div>`;
}

// --- the task itself: notes as Markdown, and the triage controls ---
function md(text) {
  if (!window.marked || !window.DOMPurify) return `<div class="content raw">${esc(text)}</div>`;  // CDN down: plain text
  const html = DOMPurify.sanitize(marked.parse(text, {gfm: true, breaks: true}));
  return `<div class="content">${html.replace(/<a /g, '<a target="_blank" rel="noopener" ')}</div>`;
}
function notes(t) {
  if (editing && editing.id === t.id) return `<textarea class="edit" id="edit-${esc(t.id)}" aria-label="Notes (Markdown)">${esc(editing.text)}</textarea>
    <div class="row"><button class="btn" data-save="${esc(t.id)}">Save</button><button class="chip" data-unedit>Cancel</button></div>`;
  return (t.content ? md(t.content) : "") + (t.closed || !t.etag ? "" : `<div class="row"><button class="chip" data-edit="${esc(t.id)}">✎ ${t.content ? "Edit notes" : "Add notes"}</button></div>`);
}
function controls(t) {
  if (t.closed || !t.etag) return "";
  const d = dueDay(t), dis = busy ? " disabled" : "", on = b => `aria-pressed="${b}"${dis}`;
  const day = (label, v) => `<button class="chip" data-day="${v}" ${on(d === v)}>${label}</button>`;
  const pri = (n, label) => `<button class="chip p${n}" data-pri="${n}" ${on((t.priority || 0) === n)}>${label}</button>`;
  return `<div class="ctl" data-task="${esc(t.id)}"><span class="lbl">Due${t.repeatFlag ? " (repeats)" : ""}</span>
      ${day("Today", today())}${day("Tomorrow", addDays(1))}${day("+1 week", addDays(7))}
      <input type="date" value="${d || ""}" aria-label="Due date"${dis}>
      <button class="chip" data-day="" ${on(!d)}>No date</button></div>
    <div class="ctl" data-task="${esc(t.id)}"><span class="lbl">Priority</span>${pri(5, "High")}${pri(3, "Med")}${pri(1, "Low")}${pri(0, "None")}</div>
    <div class="ctl" data-task="${esc(t.id)}"><button class="chip" data-status="2"${dis}>✓ Done</button>
      <button class="chip" data-status="-1"${dis}>✕ Won't do</button><span class="status" id="ed-${esc(t.id)}"></span></div>`;
}

async function change(id, fields, msg) {
  const t = byId[id] || linked; if (!t || busy) return;
  busy = true; render();
  const st = $(`#ed-${id}`); if (st) { st.className = "status"; st.textContent = "Saving…"; }
  try {
    const r = await api("api/tt/update", {id, etag: t.etag, ...fields});
    put(r.task);
    if (r.task.status) { flash = `${msg}: ${esc(r.task.title)}`; openId = null; }
    if ("content" in fields) editing = null;
  } catch (e) {
    flash = `<span class="late">Not saved. ${esc(e.message)}</span>`;
  }
  busy = false; render();
}
function put(task) {  // the server's copy of a task replaces ours
  task = {...task, day: dueDay(task), modified: stamp(task.modifiedTime), created: stamp(task.createdTime)};
  all = all.filter(x => x.id !== task.id); delete byId[task.id];
  if (!task.status) { all.push(task); byId[task.id] = task; }
  if (linked && linked.id === task.id) linked = {...task, closed: !!task.status};
}

function render() {
  for (const b of document.querySelectorAll("[data-view]")) b.setAttribute("aria-pressed", String(b.dataset.view === view && !$("#q").value.trim()));
  const shown = visible(), q = $("#q").value.trim();
  const head = q ? `${shown.length}${shown.length === 100 ? "+" : ""} found` : `${shown.length} task${shown.length === 1 ? "" : "s"}`;
  if (!shown.length) {
    const why = linkedId(q) ? (linked === "loading" ? "Looking it up…" : "That task isn't open (or the link is wrong).")
      : q ? "Nothing matches." : view === "chats" ? "No task has a chat yet." : "Nothing here.";
    $("#out").innerHTML = (flash ? `<p class="flash">${flash}</p>` : "") + `<p class="msg">${why}</p>`; return;
  }
  $("#out").innerHTML = (flash ? `<p class="flash">${flash}</p>` : "") + `<p class="msg">${head}</p>` + shown.map(t => {
    const c = chats[t.id], subs = all.filter(x => x.parentId === t.id).map(x => x.title);
    const meta = [dueText(t), esc(t.list), t.closed ? "done or deleted" : ""].filter(Boolean).join(" · ");
    const tt = t.projectId ? `<a class="link" href="https://ticktick.com/webapp/#p/${esc(t.projectId)}/tasks/${esc(t.id)}" target="_blank" rel="noopener">TickTick ›</a>` : "";
    return `<div class="t${openId === t.id ? " open" : ""}${t.sub ? " sub" : ""}">
      <button aria-expanded="${openId === t.id}" data-toggle="${esc(t.id)}"><span class="p p${t.priority || 0}"></span>
        <span class="ti">${esc(t.title)}<span class="meta">${meta}</span></span>${c ? '<span class="dot">✦</span>' : ""}</button>
      <div class="body">${openId === t.id ? notes(t) : ""}
        ${subs.length ? `<ul class="subs">${subs.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
        ${openId === t.id ? controls(t) : ""}
        <div class="row">${action(t)}</div><div class="row">${tt}</div></div></div>`;
  }).join("");
}

async function load(fresh) {
  try {
    const [r, c] = await Promise.all([api("api/tt/all" + (fresh ? "?fresh=1" : "")), api("api/tt/chats")]);
    views = r.views || {}; all = (r.tasks || []).map(t => ({...t, day: dueDay(t), modified: stamp(t.modifiedTime), created: stamp(t.createdTime)})); byId = Object.fromEntries(all.map(t => [t.id, t])); chats = c.chats || {};
    render();
    if (r.error) $("#out").insertAdjacentHTML("afterbegin", `<p class="msg bad">Showing an older copy: ${esc(r.error)}</p>`);
  } catch (e) { $("#out").innerHTML = `<p class="msg bad">Couldn't load your tasks: ${esc(e.message)}</p>`; }
}

async function start(id) {
  const btn = document.querySelector(`[data-start="${id}"]`), st = $(`#st-${id}`);
  btn.disabled = true; st.className = "status"; st.textContent = "Starting…";
  try {
    const t = byId[id] || (linked && linked.id === id ? linked : {});
    const r = await api("api/task-chat", {task_id: id, list: t.list || "", note: $(`#note-${id}`)?.value || ""});
    chats[id] = {job: r.id, rc_url: r.rc_url, title: t.title, live: true};
    if (!r.rc_url) waitForLink(id);
    render();
  } catch (e) { st.className = "status bad"; st.textContent = `Didn't start: ${e.message}`; btn.disabled = false; }
}

// The chat's link appears a few seconds after it starts; then the button becomes "Open chat".
function waitForLink(id, tries = 0) {
  clearTimeout(polling);
  polling = setTimeout(async () => {
    try { chats = (await api("api/tt/chats")).chats || {}; } catch {}
    if (chats[id]?.rc_url || tries > 30) render(); else waitForLink(id, tries + 1);
  }, 2000);
}

let typing;
$("#q").oninput = () => {
  clearTimeout(typing);
  typing = setTimeout(async () => {
    const id = linkedId($("#q").value);
    if (id && !byId[id] && (!linked || linked.id !== id)) {
      linked = "loading"; openId = id; render();
      try { linked = (await api(`api/tt/task?id=${id}`)).task; if (linked.status) linked.closed = true; } catch { linked = null; }
    } else if (id) openId = id;
    render();
  }, 150);
};
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if (v) { view = v.dataset.view; store.set("tc-view", view); $("#q").value = ""; openId = null; render(); return; }
  const tog = e.target.closest("[data-toggle]");
  if (tog) { openId = openId === tog.dataset.toggle ? null : tog.dataset.toggle; flash = ""; render(); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { const t = byId[ed.dataset.edit] || linked; editing = {id: t.id, text: t.content || ""}; render(); $(`#edit-${t.id}`)?.focus(); return; }
  if (e.target.closest("[data-unedit]")) { editing = null; render(); return; }
  const sv = e.target.closest("[data-save]");
  if (sv) { change(sv.dataset.save, {content: editing.text}, "Saved"); return; }
  const box = e.target.closest("[data-task]");
  if (box && !e.target.disabled) {
    const id = box.dataset.task, b = e.target.closest("button");
    if (b?.dataset.day !== undefined) change(id, {day: b.dataset.day || null}, "Moved");
    else if (b?.dataset.pri !== undefined) change(id, {priority: +b.dataset.pri}, "Priority");
    else if (b?.dataset.status === "2") change(id, {status: 2}, "Done");
    else if (b?.dataset.status === "-1") change(id, {status: -1}, "Won't do");
    if (b) return;
  }
  const st = e.target.closest("[data-start]");
  if (st) { start(st.dataset.start); return; }
  const res = e.target.closest("[data-resume]");
  // The link opens straight away; this brings the session back if the concierge closed it.
  if (res) fetch("api/task-chat", {method: "POST", keepalive: true, headers: {"Content-Type": "application/json"},
    body: JSON.stringify({task_id: res.dataset.resume, list: "", note: ""})}).catch(() => {});
});
document.addEventListener("input", e => { if (editing && e.target.id === `edit-${editing.id}`) editing.text = e.target.value; });
document.addEventListener("change", e => {
  const box = e.target.closest("[data-task]");
  if (box && e.target.type === "date" && e.target.value) change(box.dataset.task, {day: e.target.value}, "Moved");
});
$("#reload").onclick = () => { $("#out").insertAdjacentHTML("afterbegin", `<p class="msg">Refreshing…</p>`); load(true).then(() => setTimeout(() => load(), 6000)); };
load();
</script>
</body>
</html>
