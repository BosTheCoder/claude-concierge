<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Concierge</title>
<link rel="manifest" href="app/manifest.webmanifest">
<script src="/claude/appbar.js" defer></script>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0e1116">
<style>
  :root { --bg:#0e1116; --card:#171b22; --line:#262c36; --ink:#e6edf3; --dim:#8b949e;
    --red:#f85149; --amber:#d29922; --green:#3fb950; --blue:#58a6ff; --grey:#6e7681; --me:#1f3a5f; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  button, input, textarea, select { font:inherit; color:inherit; }
  a { color:var(--blue); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
    display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); }
  header h1 { font-size:19px; margin:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icon { background:none; border:0; font-size:20px; padding:6px 8px; cursor:pointer; color:var(--dim); }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:#2d2a12; color:var(--amber); white-space:nowrap; }
  main { padding:10px 12px 110px; max-width:720px; margin:0 auto; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:5px 12px; font-size:14px;
    white-space:nowrap; cursor:pointer; }
  .chip.on { background:var(--blue); color:#0e1116; border-color:var(--blue); }
  input.search { width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:8px; }
  .row { display:block; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--grey);
    border-radius:10px; padding:10px 12px; margin:8px 0; text-decoration:none; color:inherit; }
  .row.needs { border-left-color:var(--blue); } .row.urgent { border-left-color:var(--amber); } .row.critical { border-left-color:var(--red); }
  .row .t { font-weight:600; display:flex; gap:8px; align-items:baseline; }
  .row .t span:first-child { flex:1; }
  .row .need { font-size:13px; font-weight:600; margin-top:2px; }
  .need.decision { color:var(--amber); } .need.reply { color:var(--blue); } .need.nothing { color:var(--dim); font-weight:400; }
  .row .last { color:var(--dim); font-size:14px; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .age { color:var(--dim); font-size:12px; font-weight:400; white-space:nowrap; }
  .brief { background:#132018; border:1px solid #23402c; border-radius:10px; padding:10px 12px; margin:4px 0 10px; display:block; color:inherit; text-decoration:none; }
  .brief b { color:var(--green); }
  .fab { position:fixed; right:18px; bottom:calc(var(--appbar, 0px) + env(safe-area-inset-bottom) + 18px); width:58px; height:58px; border-radius:50%;
    border:0; background:var(--blue); color:#0e1116; font-size:30px; box-shadow:0 4px 14px #0008; cursor:pointer; }
  .muted { color:var(--dim); font-size:14px; }
  .facts { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:10px; font-size:14px; }
  .facts div { display:flex; gap:8px; } .facts b { color:var(--dim); font-weight:500; min-width:84px; }
  .summary { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;
    white-space:pre-wrap; overflow-wrap:anywhere; }
  .summary .who, .ask .who { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .ask { border:1px solid var(--amber); border-radius:10px; padding:10px 12px; margin-bottom:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .askrow { display:flex; gap:6px; margin-top:8px; } .askrow button { flex:1; }
  .ask.mail { white-space:normal; }
  .ask.mail label { display:block; font-size:12px; color:var(--dim); margin:8px 0 2px; }
  .ask.mail input, .ask.mail select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .ask.mail .body { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:10px; min-height:5em; outline:none; }
  .ask.mail .body:focus { border-color:var(--blue); } .ask.mail .body p { margin:0 0 .7em; }
  .ask.mail .muted { margin-top:6px; }
  .convo { margin:6px 0 4px; display:flex; flex-direction:column; gap:6px; }
  .convo .lbl, .convo summary { font-size:12px; color:var(--dim); }
  .convo summary { cursor:pointer; padding:2px 0 4px; } .convo details[open] { display:flex; flex-direction:column; gap:6px; }
  .em { max-width:92%; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:7px 10px; font-size:15px; }
  .em.mine { margin-left:auto; background:var(--me); border-color:#2b4c78; }
  .em .emh { font-size:12px; color:var(--dim); margin-bottom:2px; }
  .em .emt { white-space:pre-wrap; overflow-wrap:anywhere; }
  .em .emt.clamp { max-height:13em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent); }
  .em .more { background:none; border:0; color:var(--blue); padding:4px 0 0; font-size:13px; cursor:pointer; } .askrow a.btn { flex:1; text-align:center; text-decoration:none; }
  .about { font-size:13px; color:var(--dim); padding:0 4px 6px; display:flex; gap:8px; align-items:center; }
  .about span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .composer { flex-wrap:wrap; } .composer .about { flex-basis:100%; }
  .answered.withdrawn { color:var(--dim); }
  details.why { margin-top:6px; border-top:1px solid var(--line); padding-top:4px; }
  details.why summary { color:var(--blue); font-size:14px; cursor:pointer; padding:4px 0; }
  details.why div { font-size:15px; color:var(--ink); padding:2px 0 4px; }
  details.hist { margin:14px 0; } details.hist summary { color:var(--dim); cursor:pointer; padding:8px 0; }
  .msg { max-width:88%; margin:8px 0; padding:8px 11px; border-radius:12px; background:var(--card); border:1px solid var(--line);
    white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.me { margin-left:auto; background:var(--me); border-color:#2b4c78; }
  .msg.app { background:none; border-style:dashed; }
  .msg .who { font-size:12px; color:var(--dim); margin-bottom:2px; display:flex; gap:6px; align-items:center; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot.needs { background:var(--blue); } .dot.urgent { background:var(--amber); } .dot.critical { background:var(--red); } .dot.fyi { background:var(--grey); }
  .state { font-size:12px; color:var(--dim); text-align:right; margin-top:2px; }
  .state.failed { color:var(--red); } .state.acted { color:var(--green); }
  .opts { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .opts button { text-align:left; background:#0e1116; border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .opts button.rec { border-color:var(--amber); }
  .opts button.rec::after { content:"  ★ Claude's pick"; color:var(--amber); font-size:12px; }
  .answered { margin-top:6px; font-size:14px; color:var(--green); }
  .answered.claude { color:var(--amber); }
  .composer { position:fixed; left:0; right:0; bottom:var(--appbar, 0px); background:var(--bg); border-top:1px solid var(--line);
    padding:8px 10px calc(env(safe-area-inset-bottom) + 8px); display:flex; gap:8px; }
  .composer textarea { flex:1; resize:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; max-height:140px; }
  .barlist { list-style:none; margin:8px 0; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card) }
  .barlist li { display:flex; align-items:center; gap:10px; padding:6px 6px 6px 12px; border-top:1px solid var(--line); min-height:44px }
  .barlist li:first-child { border-top:0 }
  .barlist li b { width:24px; text-align:center; font-size:20px; font-weight:400 }
  .barlist li span { flex:1 }
  .barlist li.more { background:var(--bg); color:var(--dim); font-size:13px; min-height:30px; padding:4px 12px; text-transform:uppercase; letter-spacing:.06em }
  .barlist button, .stepper button { min-width:44px; min-height:40px; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:10px; font-size:18px; cursor:pointer }
  .barlist button:disabled, .stepper button:disabled { opacity:.3; cursor:default }
  .stepper { display:flex; align-items:center; gap:12px } .stepper output { min-width:1.5em; text-align:center; font-size:18px; font-weight:600 }
  .btn { background:var(--blue); color:#0e1116; border:0; border-radius:10px; padding:9px 14px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); font-weight:400; }
  .btn:disabled { opacity:.5; }
  .sheet { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
  .sheet label { display:block; font-size:14px; color:var(--dim); margin:10px 0 4px; }
  .sheet textarea, .sheet input, .sheet select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .menu { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
  h2 { font-size:15px; color:var(--dim); margin:18px 0 6px; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:14px; } td, th { padding:5px 6px; border-bottom:1px solid var(--line); text-align:right; }
  td:first-child, th:first-child { text-align:left; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:90px; background:#30363d; padding:8px 14px; border-radius:8px; font-size:14px; z-index:9; }
  textarea.capture { width:100%; min-height:40vh; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:17px; }

  /* Desktop: use the width. Home: search and filters become a sticky left sidebar, threads a grid of cards.
     A thread: what he reads on the left, its facts in a right column. Settings in two columns. */
  @media (min-width:1100px) {
    main { max-width:1440px; padding:20px 28px 110px; }
    main:has(> .side) { display:grid; grid-template-columns:260px minmax(0,1fr); column-gap:36px; align-items:start; }
    .side { grid-column:1; grid-row:1 / span 2; position:sticky; top:76px; }
    .side .chips { flex-wrap:wrap; overflow:visible; padding-bottom:12px; }
    .list, main:has(> .side) > p { grid-column:2; }
    .list { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:14px; }
    .list > .brief, .list > p { grid-column:1 / -1; margin:0; }
    .list > .row { margin:0; }
    main:has(> .menu) { display:grid; grid-template-columns:minmax(0,1fr) 380px; column-gap:32px; align-items:start; }
    main:has(> .menu) > * { grid-column:1; }
    main:has(> .menu) > .facts { grid-column:2; grid-row:1; }
    main:has(#barcfg) { columns:2; column-gap:48px; }
    main:has(#barcfg) h2, #rules { break-after:avoid; }
    main:has(#barcfg) .sheet, main:has(#barcfg) table, #barcfg { break-inside:avoid; }
    main:has(> #cap) { max-width:900px; }
  }
</style>
</head>
<body>
<header><button class="icon" id="back" hidden>←</button><h1 id="title">Concierge</h1><span class="pill" id="mode" hidden></span>
  <button class="icon" id="gear" title="Settings">⚙</button></header>
<main id="main"></main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const LV = ["fyi","needs","urgent","critical"], LVNAME = {fyi:"FYI", needs:"Needs me", urgent:"Urgent", critical:"Critical"};
const NEED = {decision:"Decision needed", reply:"Reply needed", nothing:"Nothing needed"};
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
let timer = null, filter = {need:"all", urg:"all"}, homeQ = "", showClosed = false;

async function api(path, body, label) {  // label: what sw.js's outbox calls it if it has to wait for signal
  const r = await fetch("api/" + path, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json", ...(label && {"X-Outbox-Label": encodeURIComponent(label)})}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: r.ok ? "bad reply" : `The concierge server isn't answering (${r.status}). Try again in a moment.`}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t;
  document.body.append(d); setTimeout(() => d.remove(), 2600); }
function age(iso) { const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? "now" : s < 3600 ? `${Math.floor(s/60)}m` : s < 86400 ? `${Math.floor(s/3600)}h` : `${Math.floor(s/86400)}d`; }
function head(title, back) { $("#title").textContent = title; $("#back").hidden = !back; }
function poll(fn, ms) { clearInterval(timer); timer = setInterval(() => document.visibilityState === "visible" && fn(true), ms); }

// --- home -------------------------------------------------------------------------------
async function home(quiet) {
  head("Concierge", false);
  let d;
  try { d = await api(`threads?${showClosed ? "closed=1&" : ""}q=${encodeURIComponent(homeQ)}`); }
  catch (e) { if (!quiet) $("#main").innerHTML = `<p class="muted">Can't reach the concierge: ${esc(e.message)}</p>`; return; }
  $("#mode").hidden = !d.mode; $("#mode").textContent = d.mode ? `${d.mode} on` : "";
  const rows = d.threads.filter(t => (filter.need === "all" || t.needs === filter.need) && (filter.urg === "all" || t.urgency === filter.urg));
  const chips = (key, vals, names) => vals.map(v => `<button class="chip ${filter[key] === v ? "on" : ""}" data-f="${key}" data-v="${v}">${names[v] || "All"}</button>`).join("");
  const focused = document.activeElement && document.activeElement.id === "q";
  if (quiet && focused) return;  // don't redraw under his typing
  $("#main").innerHTML = `
    <div class="side"><input class="search" id="q" placeholder="Search threads, open and closed" value="${esc(homeQ)}">
    <div class="chips">${chips("need", ["all","decision","reply","nothing"], {decision:"Decision", reply:"Reply", nothing:"FYI"})}</div>
    <div class="chips">${chips("urg", ["all","critical","urgent","needs","fyi"], LVNAME)}</div></div>
    <div class="list">${d.brief && !homeQ && !showClosed ? `<a class="brief" href="${esc(d.brief.url)}"><b>Morning Brief</b> · ${esc(d.brief.date || "")}${d.brief.red ? ` · ${d.brief.red} red` : ""}<br><span class="muted">${esc(d.brief.headline)}</span></a>` : ""}
    ${rows.map(t => `<a class="row ${t.urgency}" href="#t=${t.id}">
        <div class="t"><span>${esc(t.title)}</span><span class="age">${age(t.updated)}</span></div>
        <div class="need ${t.needs}">${t.status === "closed" ? "Closed" : NEED[t.needs]}${t.urgency !== "fyi" && t.needs !== "nothing" ? " · " + LVNAME[t.urgency] : ""}${t.floor ? " · turned down" : ""}</div>
        <div class="last">${t.last_author === "me" ? "You: " : ""}${esc(t.last)}</div></a>`).join("") || `<p class="muted">Nothing here.</p>`}</div>
    <p><button class="btn ghost" id="closed">${showClosed ? "Open threads" : "Closed threads"}</button></p>
    <button class="fab" id="fab" title="New thread">+</button>`;
  $("#main").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter[b.dataset.f] = b.dataset.v; home(); });
  $("#closed").onclick = () => { showClosed = !showClosed; home(); };
  $("#fab").onclick = () => location.hash = "new";
  let deb; $("#q").oninput = e => { clearTimeout(deb); deb = setTimeout(() => { homeQ = e.target.value; home(); setTimeout(() => { const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }); }, 300); };
  poll(home, 10000);
}

// --- a thread ---------------------------------------------------------------------------
let current = null, lastSig = "", histOpen = false, aboutId = null;
async function thread(id, quiet) {
  let t;
  try { t = await api(`threads/${id}`); } catch (e) { $("#main").innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
  const offline = await waitingAnswers();
  for (const m of t.messages) if (offline[m.id] && m.answer == null)
    Object.assign(m, {answer: offline[m.id].choice, answered_by: "me", answered_at: offline[m.id].at, state: "offline"});
  const sig = JSON.stringify([t.messages, t.facts, t.summary, t.status, t.floor, t.delegation]);
  if (quiet && sig === lastSig) return;
  if (!current || current.id !== t.id) { histOpen = false; aboutId = null; }
  lastSig = sig; current = t;
  head(t.title, true);
  const rows = facts => Object.entries(facts || {}).map(([k, v]) => `<div><b>${esc(k)}</b><span>${linkify(v)}</span></div>`).join("");
  const draft = $("#say") ? $("#say").value : "";
  // What he reads first: the summary (or, until a job writes one, its latest word) and what's waiting on him.
  // The rest is history, folded away.
  const ms = t.messages;
  // Newest first: a later decision can overtake an earlier one the job forgot to withdraw.
  const open = ms.filter(m => m.options && (m.answer === null || m.answer === undefined)).reverse();
  const lastJob = [...ms].reverse().find(m => m.author !== "me" && m.author !== "app");
  // His latest message and what came back after it (an Explain, a question): the conversation he's in.
  // After a day it's history.
  const lastMe = ms.map(m => m.author).lastIndexOf("me");
  const mine = lastMe >= 0 && Date.now() - new Date(ms[lastMe].created) < 864e5
    ? ms.slice(lastMe).filter(m => !open.includes(m)) : [];
  // Answered in the last half hour: kept up here so its Undo is one tap away.
  const recent = ms.filter(m => m.options && m.answered_at && m.answered_by !== "withdrawn" && !m.undone
    && (m.state === "offline" || Date.now() - new Date(m.answered_at) < 18e5) && !mine.includes(m)).reverse();
  // Claude's latest word always stays out of history: a summary can be stale, and the latest message is often the ask.
  const latest = lastJob && !lastJob.options && !mine.includes(lastJob) ? lastJob : null;
  const shown = new Set([...open, ...recent, ...mine, ...(latest ? [latest] : [])]);
  const past = ms.filter(m => !shown.has(m));
  const top = (t.job ? `<p class="muted">Claude chat: ${t.chat_url ? `<a href="${esc(t.chat_url)}" target="_blank" rel="noopener">${esc(t.job)} ↗</a>` : esc(t.job)}</p>` : "")
    + (t.summary ? `<div class="summary"><div class="who">Summary</div>${linkify(t.summary)}</div>` : "")
    + (latest ? `<div class="summary"><div class="who">Latest from Claude · ${age(latest.created)}</div>${linkify(latest.text)}</div>` : "");
  const other = rows(t.other_facts);
  $("#main").innerHTML = `
    ${top}
    ${open.map(m => m.kind === "draft" ? mailCard(m) : `<div class="ask"><div class="who"><span class="dot ${m.urgency}"></span> ${m.kind === "close?" ? "Concierge" : "Decision for you"} · ${age(m.created)}${m.revised ? ` · updated ${age(m.revised)}` : ""}</div>${linkify(m.text)}${fold(m, "context", "Context")}${m.recommend ? fold(m, "why", `Why Claude picks “${esc(m.recommend)}”`) : ""}${opts(m)}<div class="askrow">${m.context || m.kind === "close?" ? "" : `<button class="btn ghost" data-explain="${m.id}">Explain</button>`}<button class="btn ghost" data-about="${m.id}">Ask about this</button></div></div>`).join("")}
    ${recent.map(msg).join("")}
    ${Object.keys(t.facts || {}).length ? `<div class="facts">${rows(t.facts)}</div>` : ""}
    ${mine.map(msg).join("")}
    ${t.status === "closed" ? `<p class="muted">Closed. Reopen to carry on.</p>` : ""}
    ${past.length || other ? `<details class="hist" id="hist" ${histOpen ? "open" : ""}><summary>History · ${past.length} message${past.length === 1 ? "" : "s"}</summary>
      ${other ? `<div class="facts">${other}</div>` : ""}${past.map(msg).join("")}</details>` : ""}
    <div class="menu">
      <button class="btn ghost" id="floor">${t.floor ? "Turn back up" : "Turn down to FYI"}</button>
      <button class="btn ghost" id="openclose">${t.status === "closed" ? "Reopen" : "Close"}</button>
      <button class="btn ghost" id="deleg">${t.delegation ? "Delegated to Claude" : "Hand decisions to Claude"}</button>
    </div>
    <div id="sheet"></div>`;
  if ($("#hist")) $("#hist").ontoggle = e => histOpen = e.target.open;
  $("#main").querySelectorAll("details.why").forEach(d => d.ontoggle = () => d.open ? folds.add(d.dataset.k) : folds.delete(d.dataset.k));
  if (!$(".composer")) document.body.insertAdjacentHTML("beforeend",
    `<div class="composer"><textarea id="say" rows="1" placeholder="Message"></textarea><button class="btn" id="send">Send</button></div>`);
  $("#say").value = draft;
  $("#send").onclick = () => send(); $("#say").oninput = e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; };
  $("#floor").onclick = () => act("floor", {floor: t.floor ? null : "fyi"});
  $("#openclose").onclick = () => act(t.status === "closed" ? "reopen" : "close", {});
  $("#deleg").onclick = () => delegForm(t);
  $("#main").querySelectorAll("[data-choice]").forEach(b => b.onclick = () => choose(+b.dataset.msg, b.dataset.choice));
  $("#main").querySelectorAll("[data-undo]").forEach(b => b.onclick = () => undo(+b.dataset.undo));
  $("#main").querySelectorAll("[data-mail]").forEach(card => { const e = mails[card.dataset.mail].e;
    card.querySelectorAll("[data-f]").forEach(el => el.oninput = el.onchange = () => e[el.dataset.f] = el.dataset.f === "html" ? el.innerHTML : el.value); });
  $("#main").querySelectorAll("[data-mail]").forEach(card => { const s = mails[card.dataset.mail];
    card.querySelectorAll("[data-ui]").forEach(b => b.onclick = () => { const k = b.dataset.ui;
      s.ui.has(k) ? s.ui.delete(k) : s.ui.add(k); lastSig = ""; thread(current.id, true); });
    card.querySelectorAll("details[data-uid]").forEach(dt => dt.ontoggle = () => dt.open ? s.ui.add(dt.dataset.uid) : s.ui.delete(dt.dataset.uid)); });
  $("#main").querySelectorAll("[data-mailsend]").forEach(b => b.onclick = () => sendMail(+b.dataset.mailsend, b));
  $("#main").querySelectorAll("[data-mailretry]").forEach(b => b.onclick = () => { delete mails[b.dataset.mailretry]; lastSig = ""; thread(current.id); });
  $("#main").querySelectorAll("[data-explain]").forEach(b => b.onclick = () =>
    send("Explain this one: what it relates to, and what each option leads to and costs.", +b.dataset.explain));
  $("#main").querySelectorAll("[data-about]").forEach(b => b.onclick = () => {
    aboutId = +b.dataset.about; aboutBar(); $("#say").focus(); });
  aboutBar();
  if (!quiet) scrollTo(0, 0);
  poll(() => thread(id, true), 3000);
}
// A decision's own context and reasoning, folded under the question; open ones stay open through refreshes.
const folds = new Set();
function fold(m, key, label) {
  if (!m[key]) return "";
  const k = `${m.id}:${key}`;
  return `<details class="why" data-k="${k}" ${folds.has(k) ? "open" : ""}><summary>${label}</summary><div>${linkify(m[key])}</div></details>`;
}
function opts(m) {
  if (!m.options) return "";
  if (m.answer !== null && m.answer !== undefined)
    return m.kind === "draft" ? `<div class="answered${m.answered_by === "withdrawn" ? " withdrawn" : ""}">${esc(m.answer)}</div>`
      : m.answered_by === "withdrawn" ? `<div class="answered withdrawn">Withdrawn: ${esc(m.answer)}</div>`
      : m.answered_by === "claude"
      ? `<div class="answered claude">Claude chose “${esc(m.answer)}”${m.rule ? ` · rule: ${esc(m.rule)}` : ""}${m.undone ? " · <b>undone</b>" : ` <button class="btn ghost" data-undo="${m.id}">Undo</button>`}</div>`
      : `<div class="answered">You chose “${esc(m.answer)}”${m.state === "held" ? " · sending in a moment" : m.state === "offline" ? " · waiting for signal" : m.state === "failed" ? ` · ⚠ not delivered: ${esc(m.error || "")}` : ""} <button class="btn ghost" data-undo="${m.id}">Undo</button></div>`;
  return `<div class="opts">${m.options.map(o => `<button data-msg="${m.id}" data-choice="${esc(o)}" class="${o === m.recommend ? "rec" : ""}">${esc(o)}</button>`).join("")}</div>`;
}
// An email a job drafted: he can change From, To, Cc, Subject and the text, then Send (two taps).
// Loaded from Gmail once per visit; his edits live here, so a redraw while he types keeps them.
const mails = {}, mailLoading = new Set();
function mailCard(m) {
  const s = mails[m.id], head = `<div class="who"><span class="dot ${m.urgency}"></span> Email to send · ${age(m.created)}</div>`;
  const about = `<button class="btn ghost" data-about="${m.id}">Ask Claude to change it</button>`;
  if (!s) { loadMail(m.id); return `<div class="ask mail">${head}${linkify(m.text)}<p class="muted">Loading from Gmail…</p></div>`; }
  if (s.err) return `<div class="ask mail">${head}${linkify(m.text)}<p class="muted">⚠ ${esc(s.err)}</p>
    <div class="askrow"><button class="btn ghost" data-mailretry="${m.id}">Try again</button>${about}</div></div>`;
  const {d, e} = s, th = d.thread || [], mine = new Set(d.aliases.map(a => a.email.toLowerCase()));
  const when = v => { const t = new Date(v); return isNaN(t) ? esc(v) : t.toLocaleString([], {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); };
  const em = (x, i) => { const k = `e${i}`, long = x.text.length > 600 || x.text.split("\n").length > 12, open = s.ui.has(k);
    return `<div class="em ${mine.has(x.email.toLowerCase()) ? "mine" : ""}"><div class="emh"><b>${esc(x.from)}</b> · ${when(x.date)}</div>
      <div class="emt ${long && !open ? "clamp" : ""}">${linkify(x.text)}</div>${long ? `<button class="more" data-ui="${k}">${open ? "Show less" : "Show all"}</button>` : ""}</div>`; };
  const older = th.slice(0, -1);
  const convo = th.length ? `<div class="convo"><div class="lbl">Replying to</div>
    ${older.length ? `<details data-uid="older" ${s.ui.has("older") ? "open" : ""}><summary>${older.length} earlier email${older.length === 1 ? "" : "s"}</summary>${older.map(em).join("")}</details>` : ""}
    ${em(th[th.length - 1], th.length - 1)}</div>` : "";
  return `<div class="ask mail" data-mail="${m.id}">${head}${convo}
    <label>From</label><select data-f="from">${d.aliases.map(a => `<option value="${esc(a.email)}" ${a.email === e.from ? "selected" : ""}>${esc(a.email)}${a.name ? ` · ${esc(a.name)}` : ""}</option>`).join("")}</select>
    <label>To</label><input data-f="to" value="${esc(e.to)}" autocomplete="off">
    <label>Cc</label><input data-f="cc" value="${esc(e.cc)}" autocomplete="off">
    <label>Subject</label><input data-f="subject" value="${esc(e.subject)}" autocomplete="off">
    <div class="body" contenteditable="true" data-f="html">${e.html}</div>
    ${d.reply ? `<div class="muted">The earlier emails stay quoted underneath, as in Gmail.</div>` : ""}
    ${d.attachments.length ? `<div class="muted">📎 ${d.attachments.map(esc).join(", ")}</div>` : ""}
    <div class="askrow"><button class="btn" data-mailsend="${m.id}">Send email</button><a class="btn ghost" href="${esc(d.gmail)}" target="_blank" rel="noopener">Open in Gmail</a></div>
    <div class="askrow">${about}</div></div>`;
}
async function loadMail(id) {
  if (mailLoading.has(id)) return; mailLoading.add(id);
  try { const d = await api(`threads/${current.id}/draft?msg=${id}`);
    mails[id] = {d, ui: new Set(), e: {from: d.from, to: d.to, cc: d.cc, subject: d.subject, html: d.html}}; }
  catch (err) { mails[id] = {err: err.message}; }
  mailLoading.delete(id); lastSig = ""; thread(current.id, true);
}
async function sendMail(id, b) {
  const s = mails[id];
  if (!s.armed) { s.armed = true; b.textContent = "Tap again to send";
    setTimeout(() => { s.armed = false; if (b.isConnected && !b.disabled) b.textContent = "Send email"; }, 4000); return; }
  s.armed = false; b.disabled = true; b.textContent = "Sending…";
  const {d, e} = s;
  try { const r = await api(`threads/${current.id}/sendemail`, {msg: id, from: e.from, to: e.to, cc: e.cc, subject: e.subject,
      ...(e.html !== d.html && {html: e.html})}, `Send email “${e.subject}”`);
    toast(r.queued ? "No signal: the email sends when you're back online" : `Sent from ${e.from}`);
    if (!r.queued) delete mails[id];
    lastSig = ""; thread(current.id); }
  catch (err) { toast(err.message); b.disabled = false; b.textContent = "Send email"; }
}
function msg(m) {
  const who = {me:"You", job:"Claude", claude:"Claude (decided for you)", app:"Concierge"}[m.author] || m.author;
  const states = {sent:"✓ sent", picked:"✓✓ picked up", acted:"✓✓ acted on", failed:"⚠ not delivered: " + (m.error || "")};
  return `<div class="msg ${m.author}">${m.author !== "me" ? `<div class="who"><span class="dot ${m.urgency}"></span>${who} · ${age(m.created)}</div>` : ""}${linkify(m.text)}${opts(m)}${m.author === "me" && m.state ? `<div class="state ${m.state}">${esc(states[m.state] || m.state)}</div>` : ""}</div>`;
}
async function act(action, body) {
  try { await api(`threads/${current.id}/${action}`, body); lastSig = ""; thread(current.id); }
  catch (e) { toast(e.message); }
}
// "Ask about this": his next message is tied to that decision, shown above the box until sent or dropped.
function aboutBar() {
  $(".composer .about")?.remove();
  const d = current && aboutId && current.messages.find(m => m.id === aboutId);
  if (!d) return;
  $(".composer").insertAdjacentHTML("afterbegin", `<div class="about"><span>About: ${esc(d.text)}</span><button class="icon" id="aboutx">✕</button></div>`);
  $("#aboutx").onclick = () => { aboutId = null; aboutBar(); };
}
async function send(canned, about) {
  const text = canned || $("#say").value.trim(); if (!text) return;
  const re = canned ? about : aboutId;
  $("#send").disabled = true;
  try { const r = await api(`threads/${current.id}/say`, {text, ...(re && {about: re})}, `Message in “${current.title}”: ${text.slice(0, 80)}`);
    if (!canned) { $("#say").value = ""; $("#say").style.height = "auto"; aboutId = null; aboutBar(); }
    toast(r.queued ? "Not sent yet: it sends when the connection is back" : canned ? "Asked Claude to explain" : "Sent");
    setTimeout(() => { lastSig = ""; thread(current.id); }, 400); }
  catch (e) { toast(e.message); }
  $("#send").disabled = false;
}
async function choose(id, choice) {
  try { const r = await api(`threads/${current.id}/answer`, {msg:id, choice}, `Answer “${choice}” in “${current.title}”`);
    toast(r.queued ? `No signal: “${choice}” sends when you're back online. Undo is under the question` : current.messages.find(m => m.id === id)?.kind === "close?" ? `Done: ${choice}. Undo is under the question`
      : `“${choice}” goes in 10s. Undo is under the question`);
    setTimeout(() => { lastSig = ""; thread(current.id); }, 400); }
  catch (e) { toast(e.message); }
}
// Answers tapped with no signal, still in sw.js's outbox: shown as chosen, and Undo just takes them out.
async function waitingAnswers() {
  const out = {};
  if (!window.caches) return out;
  const box = await caches.open("outbox");
  for (const k of await box.keys()) {
    if (/\/outbox\/(sent|failed)-/.test(k.url)) continue;
    const i = await (await box.match(k)).json().catch(() => ({}));
    if (!/\/threads\/\d+\/answer$/.test(i.url || "")) continue;
    const b = JSON.parse(i.body || "{}");
    out[b.msg] = {choice: b.choice, at: i.at, key: k.url};
  }
  return out;
}
async function undo(id) {
  const held = (await waitingAnswers())[id];
  if (held && await (await caches.open("outbox")).delete(held.key)) {
    toast("Taken back. It never left your phone"); dispatchEvent(new Event("outbox-changed"));
  } else {
    try { const r = await api(`threads/${current.id}/undo`, {msg:id}, `Undo in “${current.title}”`);
      toast(r.queued ? "No signal: the undo goes when you're back online" : "Taken back. If Claude already had it, it's been told"); }
    catch (e) { toast(e.message); return; }
  }
  lastSig = ""; thread(current.id);
}
function delegForm(t) {
  if (t.delegation) {
    const d = t.delegation;
    $("#sheet").innerHTML = `<div class="sheet"><b>Claude may decide here</b>${d.until ? ` until ${esc(new Date(d.until).toLocaleString())}` : ""}${d.thread ? "" : " (all threads)"}
      <p style="white-space:pre-wrap">${esc(d.spec)}</p><button class="btn" id="end">Stop delegating</button></div>`;
    $("#end").onclick = async () => { await api("delegations/end", {id:d.id}); lastSig = ""; thread(t.id); };
    return;
  }
  const qs = [["may", "What may Claude decide on its own?", "e.g. which day a contractor comes, chasing replies"],
    ["never", "What is off limits?", "e.g. hiring, anything the tenant has to agree to"],
    ["money", "Money limit (£). Blank = Claude spends nothing", ""],
    ["ask", "When must it stop and ask you?", "e.g. a quote changes, someone complains"],
    ["lean", "When it's unsure between options, prefer…", "e.g. the one I can reverse, the cheaper one"]];
  $("#sheet").innerHTML = `<div class="sheet"><b>Hand decisions to Claude</b>
    ${qs.map(([k, q, ph]) => `<label>${q}</label><textarea id="d_${k}" rows="2" placeholder="${esc(ph)}"></textarea>`).join("")}
    <label>Covers</label><select id="d_scope"><option value="thread">This thread</option><option value="all">All threads</option></select>
    <label>Only this kind of decision (optional)</label><input id="d_kind" placeholder="e.g. scheduling">
    <label>Until (blank = until you stop it)</label><input id="d_until" type="datetime-local">
    <p><button class="btn" id="d_go">Start</button> <button class="btn ghost" id="d_x">Cancel</button></p></div>`;
  $("#d_x").onclick = () => $("#sheet").innerHTML = "";
  $("#d_go").onclick = async () => {
    const v = k => $("#d_" + k).value.trim();
    if (!v("may")) return toast("Say what Claude may decide");
    const spec = [`May decide: ${v("may")}`, v("never") && `Off limits: ${v("never")}`,
      `Money: ${v("money") ? "up to £" + v("money") + " per decision" : "none, any spend goes to Kelvin"}`,
      v("ask") && `Ask Kelvin when: ${v("ask")}`, v("lean") && `When unsure, prefer: ${v("lean")}`].filter(Boolean).join("\n");
    const until = v("until") ? new Date(v("until")).toISOString() : "";
    try { await api(`threads/${t.id}/delegate`, {spec, scope:v("scope"), kind:v("kind"), until}); lastSig = ""; thread(t.id); }
    catch (e) { toast(e.message); }
  };
}

// --- quick capture --------------------------------------------------------------------
function capture() {
  head("New thread", true);
  const p = new URLSearchParams(location.search);
  const shared = [p.get("title"), p.get("text"), p.get("url")].filter(Boolean).join("\n");
  $("#main").innerHTML = `<textarea class="capture" id="cap" placeholder="What do you need? (tap the mic on the keyboard to talk)">${esc(shared)}</textarea>
    <p><button class="btn" id="go">Start</button></p>`;
  history.replaceState(null, "", location.pathname + location.hash);
  $("#cap").focus();
  $("#go").onclick = async () => {
    const text = $("#cap").value.trim(); if (!text) return;
    $("#go").disabled = true; $("#go").textContent = "Starting…";
    try { const r = await api("threads", {text}); toast("Started"); location.hash = `t=${r.id}`; }
    catch (e) { toast(e.message); $("#go").disabled = false; $("#go").textContent = "Start"; }
  };
}

// --- settings: rules, modes, delegations, stats ----------------------------------------
async function settings() {
  head("Settings", true);
  const s = await api("settings");
  const modeRow = m => `<div class="sheet" data-mode="${m.id || ""}">
      <label>Name</label><input class="m_name" value="${esc(m.name || "")}">
      <label>What gets through</label><div class="menu">${LV.map(l => `<label style="margin:0"><input type="checkbox" class="m_allow" value="${l}" ${m.allow && m.allow.includes(l) ? "checked" : ""}> ${LVNAME[l]}</label>`).join(" ")}</div>
      <label>From</label><div class="menu"><select class="m_sd">${DAYS.map((d, i) => `<option value="${i}" ${i === m.start_day ? "selected" : ""}>${d}</option>`).join("")}</select>
        <input class="m_st" value="${esc(m.start_time || "sunset")}" placeholder="HH:MM or sunset" style="width:9em"></div>
      <label>Until</label><div class="menu"><select class="m_ed">${DAYS.map((d, i) => `<option value="${i}" ${i === m.end_day ? "selected" : ""}>${d}</option>`).join("")}</select>
        <input class="m_et" value="${esc(m.end_time || "sunset")}" placeholder="HH:MM or sunset" style="width:9em"></div>
      <label><input type="checkbox" class="m_on" ${m.enabled !== 0 ? "checked" : ""}> On</label>
      <p><button class="btn m_save">Save</button> ${m.id ? `<button class="btn ghost m_del">Delete</button>` : ""}</p></div>`;
  $("#main").innerHTML = `
    <h2>Bottom bar</h2><div id="barcfg"></div>
    <h2>Global decision rules</h2><p class="muted">Every decision Claude takes follows these, plus the thread's own spec.</p>
    <textarea id="rules" class="capture" style="min-height:8em">${esc(s.rules)}</textarea><p><button class="btn" id="saverules">Save rules</button></p>
    <h2>Delegations in force</h2>${s.delegations.map(d => `<div class="sheet"><b>${d.thread ? esc(d.title || "thread " + d.thread) : "All threads"}</b>${d.kind ? ` · ${esc(d.kind)}` : ""}${d.until ? ` · until ${esc(new Date(d.until).toLocaleString())}` : ""}
      <p style="white-space:pre-wrap" class="muted">${esc(d.spec)}</p><button class="btn ghost" data-end="${d.id}">Stop</button></div>`).join("") || `<p class="muted">None. Every decision comes to you.</p>`}
    <h2>Notification modes</h2><p class="muted">"sunset" works as a time. What a mode holds back arrives as one alert when it ends.</p>
    ${s.modes.map(modeRow).join("")}<button class="btn ghost" id="addmode">Add a mode</button>
    <h2>Alerts per week</h2><table><tr><th>Week</th>${LV.map(l => `<th>${LVNAME[l]}</th>`).join("")}</tr>
      ${s.stats.map(w => `<tr><td>${esc(w.week)}</td>${LV.map(l => `<td>${w[l]}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="5" class="muted">No messages yet</td></tr>`}</table>`;
  barSettings();
  $("#saverules").onclick = async () => { await api("settings/rules", {rules: $("#rules").value}); toast("Saved"); };
  $("#main").querySelectorAll("[data-end]").forEach(b => b.onclick = async () => { await api("delegations/end", {id:+b.dataset.end}); settings(); });
  $("#addmode").onclick = () => { $("#addmode").insertAdjacentHTML("beforebegin", modeRow({allow:["critical"], start_day:4, end_day:5})); wireModes(); };
  wireModes();
}
// The phone's bottom bar: which panes sit in it, in what order. appbar.js owns the panes and saving.
async function barSettings() {
  const box = $("#barcfg");
  if (!window.appbar && document.readyState === "loading") await new Promise(r => addEventListener("DOMContentLoaded", r, {once: true}));
  if (!window.appbar) { box.innerHTML = `<p class="muted">Open the app from its main address to set this.</p>`; return; }
  let {panes, main} = window.appbar.layout();
  const draw = () => {
    const row = (p, i) => `<li><b aria-hidden="true">${p.icon}</b><span>${esc(p.name)}</span>
      <button data-up="${i}" ${i ? "" : "disabled"} aria-label="Move ${esc(p.name)} up">↑</button>
      <button data-down="${i}" ${i < panes.length - 1 ? "" : "disabled"} aria-label="Move ${esc(p.name)} down">↓</button></li>`;
    const items = panes.map(row);
    if (panes.length > main + 1) items.splice(main, 0, `<li class="more" aria-hidden="true">⋯ Under More</li>`);
    box.innerHTML = `<p class="muted">The top ones sit in the bar; the rest open from More.</p>
      <div class="stepper"><span>In the bar</span><button id="barless" aria-label="Fewer in the bar" ${main > 1 ? "" : "disabled"}>−</button>
        <output>${main}</output><button id="barmore" aria-label="More in the bar" ${main < Math.min(6, panes.length) ? "" : "disabled"}>+</button></div>
      <ul class="barlist">${items.join("")}</ul><p><button class="btn" id="savebar">Save bar</button></p>`;
    box.querySelectorAll("[data-up],[data-down]").forEach(b => b.onclick = () => {
      const i = +(b.dataset.up ?? b.dataset.down), j = b.dataset.up !== undefined ? i - 1 : i + 1;
      [panes[i], panes[j]] = [panes[j], panes[i]]; draw();
      box.querySelector(`[data-${b.dataset.up !== undefined ? "up" : "down"}="${j}"]`)?.focus();
    });
    $("#barless").onclick = () => { main--; draw(); };
    $("#barmore").onclick = () => { main++; draw(); };
    $("#savebar").onclick = async () => {
      try { await window.appbar.save({order: panes.map(p => p.id), main}); toast("Saved"); } catch (e) { toast(e.message); }
    };
  };
  draw();
}
function wireModes() {
  document.querySelectorAll("[data-mode]").forEach(el => {
    const g = c => el.querySelector(c);
    g(".m_save").onclick = async () => {
      try { await api("settings/mode", {id: el.dataset.mode || null, name: g(".m_name").value, enabled: g(".m_on").checked,
        allow: [...el.querySelectorAll(".m_allow:checked")].map(x => x.value), start_day: +g(".m_sd").value,
        start_time: g(".m_st").value.trim(), end_day: +g(".m_ed").value, end_time: g(".m_et").value.trim()});
        toast("Saved"); settings(); } catch (e) { toast(e.message); }
    };
    if (g(".m_del")) g(".m_del").onclick = async () => { await api("settings/mode/delete", {id:+el.dataset.mode}); settings(); };
  });
}

// --- routing ----------------------------------------------------------------------------
function route() {
  clearInterval(timer); lastSig = ""; current = null;
  document.querySelector(".composer")?.remove();
  const h = location.hash.slice(1);
  if (h.startsWith("t=")) return thread(+h.slice(2));
  if (h === "new" || new URLSearchParams(location.search).has("text") || new URLSearchParams(location.search).has("url")) return capture();
  if (h === "settings") return settings();
  home();
}
$("#back").onclick = () => history.length > 1 ? history.back() : (location.hash = "");
$("#gear").onclick = () => location.hash = "settings";
addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") current ? thread(current.id, true) : route(); });
route();
