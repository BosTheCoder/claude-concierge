<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Concierge</title>
<link rel="manifest" href="app/manifest.webmanifest">
<script src="/claude/appbar.js" defer></script>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0e1116">
<style>
  :root { --bg:#0e1116; --card:#171b22; --line:#262c36; --ink:#e6edf3; --dim:#8b949e;
    --red:#f85149; --amber:#d29922; --green:#3fb950; --blue:#58a6ff; --grey:#6e7681; --me:#1f3a5f; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  button, input, textarea, select { font:inherit; color:inherit; }
  a { color:var(--blue); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
    display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); }
  header h1 { font-size:19px; margin:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icon { background:none; border:0; font-size:20px; padding:6px 8px; cursor:pointer; color:var(--dim); }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:#2d2a12; color:var(--amber); white-space:nowrap; }
  main { padding:10px 12px 110px; max-width:720px; margin:0 auto; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:5px 12px; font-size:14px;
    white-space:nowrap; cursor:pointer; }
  .chip.on { background:var(--blue); color:#0e1116; border-color:var(--blue); }
  input.search { width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:8px; }
  .row { display:block; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--grey);
    border-radius:10px; padding:10px 12px; margin:8px 0; text-decoration:none; color:inherit; }
  .row.needs { border-left-color:var(--blue); } .row.urgent { border-left-color:var(--amber); } .row.critical { border-left-color:var(--red); }
  .row .t { font-weight:600; display:flex; gap:8px; align-items:baseline; }
  .row .t span:first-of-type { flex:1; }
  .row.working { border-left-color:var(--green); animation:breathe 1.6s ease-in-out infinite; }
  .row .live { width:8px; height:8px; border-radius:50%; background:var(--green); flex:none; align-self:center; animation:pulse 1.2s ease-in-out infinite; }
  .need .working, .muted .working { color:var(--green); }
  @keyframes pulse { 50% { opacity:.25; transform:scale(.7); } }
  @keyframes breathe { 50% { border-left-color:#1d5a2a; } }
  @media (prefers-reduced-motion: reduce) { .row.working, .row .live { animation:none; } }
  .row .need { font-size:13px; font-weight:600; margin-top:2px; }
  .need.decision { color:var(--amber); } .need.reply { color:var(--blue); } .need.nothing { color:var(--dim); font-weight:400; }
  .row .last { color:var(--dim); font-size:14px; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .age { color:var(--dim); font-size:12px; font-weight:400; white-space:nowrap; }
  .brief { background:#132018; border:1px solid #23402c; border-radius:10px; padding:10px 12px; margin:4px 0 10px; display:block; color:inherit; text-decoration:none; }
  .brief b { color:var(--green); }
  .usage { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin:4px 0 10px; font-size:14px;
    display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; }
  .usage .u { display:contents; }
  .usage .bar { position:relative; height:8px; background:var(--line); border-radius:99px; }
  .usage .bar i { position:absolute; inset:0 auto 0 0; border-radius:99px; background:var(--green); }
  .usage .bar i.amber { background:var(--amber); } .usage .bar i.red { background:var(--red); }
  .usage .bar s { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--dim); }
  .fab { position:fixed; right:18px; bottom:calc(var(--appbar, 0px) + env(safe-area-inset-bottom) + 18px); width:58px; height:58px; border-radius:50%;
    border:0; background:var(--blue); color:#0e1116; font-size:30px; box-shadow:0 4px 14px #0008; cursor:pointer; }
  .muted { color:var(--dim); font-size:14px; }
  .facts { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:10px; font-size:14px; }
  .facts div { display:flex; gap:8px; } .facts b { color:var(--dim); font-weight:500; min-width:84px; } .facts span { min-width:0; overflow-wrap:anywhere; }
  .summary { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;
    white-space:pre-wrap; overflow-wrap:anywhere; }
  .summary .who, .ask .who { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .ask { border:1px solid var(--amber); border-radius:10px; padding:10px 12px; margin-bottom:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .askrow { display:flex; gap:6px; margin-top:8px; } .askrow button { flex:1; }
  .ask.mail { white-space:normal; }
  .ask.mail label { display:block; font-size:12px; color:var(--dim); margin:8px 0 2px; }
  .ask.mail input, .ask.mail select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .ask.mail .body { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:10px; min-height:5em; outline:none; }
  .ask.mail textarea.body { width:100%; resize:vertical; font:inherit; color:inherit; display:block; }
  .chathead { margin:2px 0 4px; } .chathead b { font-weight:600; }
  .ask.mail .body:focus { border-color:var(--blue); } .ask.mail .body p { margin:0 0 .7em; }
  .ask.mail .muted { margin-top:6px; }
  .convo { margin:6px 0 4px; display:flex; flex-direction:column; gap:6px; }
  .convo .lbl, .convo summary { font-size:12px; color:var(--dim); }
  .convo summary { cursor:pointer; padding:2px 0 4px; } .convo details[open] { display:flex; flex-direction:column; gap:6px; }
  .em { max-width:92%; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:7px 10px; font-size:15px; }
  .em.mine { margin-left:auto; background:var(--me); border-color:#2b4c78; }
  .em .emh { font-size:12px; color:var(--dim); margin-bottom:2px; }
  .em .emt { white-space:pre-wrap; overflow-wrap:anywhere; }
  .em .emt.clamp { max-height:13em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent); }
  .em .more { background:none; border:0; color:var(--blue); padding:4px 0 0; font-size:13px; cursor:pointer; } .askrow a.btn { flex:1; text-align:center; text-decoration:none; }
  .about { font-size:13px; color:var(--dim); padding:0 4px 6px; display:flex; gap:8px; align-items:center; }
  .about span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .composer { flex-wrap:wrap; } .composer .about { flex-basis:100%; }
  .answered.withdrawn { color:var(--dim); }
  details.why { margin-top:6px; border-top:1px solid var(--line); padding-top:4px; }
  details.why summary { color:var(--blue); font-size:14px; cursor:pointer; padding:4px 0; }
  details.why div { font-size:15px; color:var(--ink); padding:2px 0 4px; }
  details.hist { margin:14px 0; } details.hist summary { color:var(--dim); cursor:pointer; padding:8px 0; }
  .msg { max-width:88%; margin:8px 0; padding:8px 11px; border-radius:12px; background:var(--card); border:1px solid var(--line);
    white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.me { margin-left:auto; background:var(--me); border-color:#2b4c78; }
  .msg.app { background:none; border-style:dashed; }
  .msg .who { font-size:12px; color:var(--dim); margin-bottom:2px; display:flex; gap:6px; align-items:center; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot.needs { background:var(--blue); } .dot.urgent { background:var(--amber); } .dot.critical { background:var(--red); } .dot.fyi { background:var(--grey); }
  .state { font-size:12px; color:var(--dim); text-align:right; margin-top:2px; }
  .state.failed { color:var(--red); } .state.acted { color:var(--green); }
  .opts { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .opts button { text-align:left; background:#0e1116; border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .opts button.rec { border-color:var(--amber); }
  .opts button.rec::after { content:"  ★ Claude's pick"; color:var(--amber); font-size:12px; }
  .answered { margin-top:6px; font-size:14px; color:var(--green); }
  .answered.claude { color:var(--amber); }
  .composer { position:fixed; left:0; right:0; bottom:var(--appbar, 0px); background:var(--bg); border-top:1px solid var(--line);
    padding:8px 10px calc(env(safe-area-inset-bottom) + 8px); display:flex; gap:8px; }
  .composer textarea { flex:1; resize:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; max-height:140px; }
  .barlist { list-style:none; margin:8px 0; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card) }
  .barlist li { display:flex; align-items:center; gap:10px; padding:6px 6px 6px 12px; border-top:1px solid var(--line); min-height:44px }
  .barlist li:first-child { border-top:0 }
  .barlist li b { width:24px; text-align:center; font-size:20px; font-weight:400 }
  .barlist li span { flex:1 }
  .barlist li.more { background:var(--bg); color:var(--dim); font-size:13px; min-height:30px; padding:4px 12px; text-transform:uppercase; letter-spacing:.06em }
  .barlist button, .stepper button { min-width:44px; min-height:40px; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:10px; font-size:18px; cursor:pointer }
  .barlist button:disabled, .stepper button:disabled { opacity:.3; cursor:default }
  .stepper { display:flex; align-items:center; gap:12px } .stepper output { min-width:1.5em; text-align:center; font-size:18px; font-weight:600 }
  .btn { background:var(--blue); color:#0e1116; border:0; border-radius:10px; padding:9px 14px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); font-weight:400; }
  .btn:disabled { opacity:.5; }
  .sheet { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
  .sheet label { display:block; font-size:14px; color:var(--dim); margin:10px 0 4px; }
  .sheet textarea, .sheet input, .sheet select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .menu { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
  h2 { font-size:15px; color:var(--dim); margin:18px 0 6px; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:14px; } td, th { padding:5px 6px; border-bottom:1px solid var(--line); text-align:right; }
  td:first-child, th:first-child { text-align:left; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:90px; background:#30363d; padding:8px 14px; border-radius:8px; font-size:14px; z-index:9; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; } .thumbs:empty { display:none; }
  .thumbs span { position:relative; } .thumbs img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; }
  .thumbs i { width:72px; height:72px; border-radius:8px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-style:normal; font-size:11px; padding:4px; text-align:center; overflow:hidden; overflow-wrap:anywhere; background:var(--card); }
  .composer .thumbs { flex-basis:100%; margin:0 0 4px; } .composer .clip { align-self:center; cursor:pointer; font-size:20px; padding:0 2px; }
  .thumbs button { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:0; background:var(--ink); color:var(--card); cursor:pointer; line-height:22px; padding:0; }
  .gal { display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x mandatory; margin:8px 0; white-space:normal; scrollbar-width:none; }
  .gal img { height:260px; max-width:85%; flex:none; object-fit:cover; scroll-snap-align:start; border-radius:8px; background:var(--line); cursor:zoom-in; }
  .deck { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; margin:8px 0; white-space:normal; scrollbar-width:none; }
  .dcard { flex:none; width:78%; max-width:340px; scroll-snap-align:start; background:var(--bg); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; }
  .dcard.rec { border-color:var(--amber); }
  .dcard img { width:100%; height:180px; object-fit:cover; display:block; background:var(--line); }
  .dcard b { display:block; padding:8px 10px 0; } .dcard.rec b::after { content:"  ★"; color:var(--amber); }
  .dcard p { margin:4px 10px 10px; color:var(--dim); font-size:14px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .lightbox { position:fixed; inset:0; background:#000; z-index:20; }
  .lightbox .track { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .lightbox .track img { flex:none; width:100%; height:100%; object-fit:contain; scroll-snap-align:center; }
  .lightbox .bar { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background:linear-gradient(#000a, transparent); color:#fff; }
  .lightbox .track > .slide { flex:none; width:100%; height:100%; overflow-y:auto; scroll-snap-align:center; background:var(--bg); padding:56px 0 24px; }
  .slide .gal { display:block; margin:0; } .slide .gal img { width:100%; max-width:none; height:auto; border-radius:0; margin-bottom:4px; display:block; }
  .slide h3 { margin:12px 14px 6px; font-size:20px; } .slide p { margin:0 14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .slide .btn { margin:14px; } .slide p + .gal { margin-top:14px; }
  .lightbox .bar span { flex:1; } .lightbox .bar a { color:#fff; } .lightbox .bar button { color:#fff; font-size:22px; }
  textarea.capture { width:100%; min-height:40vh; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:17px; }

  /* Desktop: use the width. Home: search and filters become a sticky left sidebar, threads a grid of cards.
     A thread: what he reads on the left, its facts in a right column. Settings in two columns. */
  @media (min-width:1100px) {
    main { max-width:1440px; padding:20px 28px 110px; }
    main:has(> .side) { display:grid; grid-template-columns:260px minmax(0,1fr); column-gap:36px; align-items:start; }
    .side { grid-column:1; grid-row:1 / span 2; position:sticky; top:76px; }
    .side .chips { flex-wrap:wrap; overflow:visible; padding-bottom:12px; }
    .list, main:has(> .side) > p { grid-column:2; }
    .list { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:14px; }
    .list > .brief, .list > .usage, .list > p { grid-column:1 / -1; margin:0; }
    .list > .row { margin:0; }
    main:has(> .menu) { display:grid; grid-template-columns:minmax(0,1fr) 380px; column-gap:32px; align-items:start; }
    main:has(> .menu) > * { grid-column:1; }
    main:has(> .menu) > .facts { grid-column:2; grid-row:1; }
    main:has(#barcfg) { columns:2; column-gap:48px; }
    main:has(#barcfg) h2, #rules { break-after:avoid; }
    main:has(#barcfg) .sheet, main:has(#barcfg) table, #barcfg { break-inside:avoid; }
    main:has(> #cap) { max-width:900px; }
  }
  .slash { list-style:none; margin:6px 0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow-y:auto; max-height:50vh; }
  .composer .slash { position:absolute; left:10px; right:10px; bottom:100%; margin:0 0 6px; box-shadow:0 -4px 16px #0008; }
  .slash li { padding:8px 12px; border-top:1px solid var(--line); cursor:pointer; }
  .slash li:first-child { border-top:0 } .slash li.on { background:var(--line); }
  .slash b { font-weight:600 } .slash i { font-style:normal; color:var(--dim); font-size:12px; margin-left:6px }
  .slash small { display:block; color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<header><button class="icon" id="back" hidden>←</button><h1 id="title">Concierge</h1><span class="pill" id="mode" hidden></span>
  <button class="icon" id="gear" title="Settings">⚙</button></header>
<main id="main"></main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// A photo (a GitHub link to an image, or a media: ref from --image) isn't shown as text: it's in
// the strip gal() draws under the text. Lines that were only a photo go with it.
const IMGURL = /^(https:\/\/github\.com\/\S+\.(png|jpe?g|webp|gif)(\?raw=true)?|media:\S+)$/i;
const linkify = s => esc(String(s ?? "").split("\n").filter(l => !IMGURL.test(l.trim())).join("\n").replace(/\n+$/, ""))
  .replace(/https?:\/\/[^\s<]+/g, u => IMGURL.test(u) ? "" : `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
// A decision done in the vault browser gets a button straight to it: on the job's tab when it
// passed `ask --browser`, else the browser as it is (an older ask that only says "vault browser").
const VAULTURL = /https?:\/\/[^\s<]*\/vault\/[^\s<]*/;
function vaultBtn(m) {
  const all = [m.text, m.context, m.why].join(" ");
  const href = (all.match(VAULTURL) || [/vault browser/i.test(all) ? "vault/" : ""])[0];
  return href ? `<div class="askrow"><a class="btn" href="${esc(href)}" target="_blank" rel="noopener">◳ Open the browser</a></div>` : "";
}
// Photos a job linked (GitHub links to images): a strip he swipes, tap for the full-screen gallery.
// The repos are private, so they come from the checkout on this machine (/api/img).
const imgSrc = u => u.startsWith("media:") ? "api/media?f=" + encodeURIComponent(u.slice(6)) : "api/img?u=" + encodeURIComponent(u);
function gal(...texts) {
  const urls = [...new Set(texts.flatMap(t => String(t ?? "").match(/https?:\/\/[^\s<]+|media:\S+/g) || []).filter(u => IMGURL.test(u)))];
  return urls.length ? `<div class="gal" data-urls="${esc(JSON.stringify(urls))}">${urls.map((u, i) =>
    `<img loading="lazy" src="${imgSrc(u)}" data-gal="${i}" alt="Photo ${i + 1} of ${urls.length}">`).join("")}</div>` : "";
}
function lightbox(urls, at) {
  const box = document.createElement("div"); box.className = "lightbox";
  box.innerHTML = `<div class="bar"><span></span><button class="icon" aria-label="Close">✕</button></div>`;
  const track = document.createElement("div"); track.className = "track";
  track.innerHTML = urls.map((u, i) => `<img src="${imgSrc(u)}" alt="Photo ${i + 1} of ${urls.length}">`).join("");
  box.prepend(track); document.body.append(box);
  const n = () => { const i = Math.round(track.scrollLeft / track.clientWidth);
    box.querySelector("span").textContent = `${i + 1} / ${urls.length}`; };
  track.scrollLeft = at * track.clientWidth; n(); track.onscroll = n;
  const key = e => { if (e.key === "Escape") history.back();
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") track.scrollBy({left: (e.key === "ArrowRight" ? 1 : -1) * track.clientWidth, behavior: "smooth"}); };
  // The phone's back button closes it rather than leaving the thread.
  history.pushState({lightbox: 1}, "");
  const shut = () => { box.remove(); removeEventListener("keydown", key); removeEventListener("popstate", shut); };
  addEventListener("popstate", shut); addEventListener("keydown", key);
  box.querySelector("button").onclick = () => history.back();
}
// Cards a job attached (--card): one per thing he's choosing between, swiped like a dating app.
// The row shows each card's first photo and a few lines; tap one for the full-screen deck, where he
// swipes between cards and scrolls down each one's photos and details, and can pick it from there.
const decks = {};
function deck(m) {
  if (!m.cards) return "";
  decks[m.id] = m;
  return `<div class="deck">${m.cards.map((c, i) => `<div class="dcard${c.title === m.recommend ? " rec" : ""}" data-deck="${m.id}" data-i="${i}">
    ${c.images[0] ? `<img loading="lazy" src="${imgSrc(c.images[0])}" alt="">` : ""}<b>${esc(c.title)}</b><p>${esc(c.text)}</p></div>`).join("")}</div>`;
}
function deckView(m, at) {
  const live = m.options && m.answer == null;
  const box = document.createElement("div"); box.className = "lightbox";
  box.innerHTML = `<div class="bar"><span></span><button class="icon" aria-label="Close">✕</button></div>`;
  const track = document.createElement("div"); track.className = "track";
  // First photo, then the details and Pick, then the rest of the photos to scroll down through.
  const pics = (c, from, to) => c.images.length > from ? `<div class="gal" data-urls="${esc(JSON.stringify(c.images))}">${c.images.slice(from, to).map((u, j) =>
    `<img loading="lazy" src="${imgSrc(u)}" data-gal="${from + j}" alt="">`).join("")}</div>` : "";

// Answers tapped with no signal, still in sw.js's outbox: shown as chosen, and Undo just takes them out.
async function waitingAnswers() {
  const out = {};
  if (!window.caches) return out;
  const box = await caches.open("outbox");
  for (const k of await box.keys()) {
    if (/\/outbox\/(sent|failed)-/.test(k.url)) continue;
    const i = await (await box.match(k)).json().catch(() => ({}));
    if (!/\/threads\/\d+\/answer$/.test(i.url || "")) continue;
    const b = JSON.parse(i.body || "{}");
    out[b.msg] = {choice: b.choice, at: i.at, key: k.url};
  }
  return out;
}
async function undo(id) {
  const held = (await waitingAnswers())[id];
  if (held && await (await caches.open("outbox")).delete(held.key)) {
    toast("Taken back. It never left your phone"); dispatchEvent(new Event("outbox-changed"));
  } else {
    try { const r = await api(`threads/${current.id}/undo`, {msg:id}, `Undo in “${current.title}”`);
      toast(r.queued ? "No signal: the undo goes when you're back online" : "Taken back. If Claude already had it, it's been told"); }
    catch (e) { toast(e.message); return; }
  }
  lastSig = ""; thread(current.id);
}

async function sharedIn(att) {

      else files.push(new File([await r.blob()], decodeURIComponent(r.headers.get("X-Name") || "file"), {type: r.headers.get("Content-Type") || ""}));
    }

// Attachments for a text box: paste, drop or 📎, any kind of file, up to 10 and about 28 MB in all
// (the server takes 40 MB of base64). Images are shrunk (shrink); everything else goes as it is.
function attacher(ta, zone, thumbs, pick) {
  const files = [];  // {name, data: a data: URL, img}, in the order he added them
  const draw = () => { thumbs.innerHTML = files.map((f, i) => `<span>${f.img ? `<img src="${f.data}" alt="${esc(f.name)}">` : `<i>${esc(f.name)}</i>`}<button data-rm="${i}" aria-label="Remove ${esc(f.name)}">×</button></span>`).join("");
    thumbs.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { files.splice(+b.dataset.rm, 1); draw(); }); };
  const add = async list => {
    for (const f of list) {
      if (files.length >= 10) { toast("10 files at most"); break; }
      let one;
      try { one = f.type.startsWith("image/") ? await shrink(f) : {name: f.name || "file", data: await readURL(f)}; }
      catch { toast(`Couldn't read ${f.name || "that file"}`); continue; }
      if (files.reduce((n, x) => n + x.data.length, one.data.length) > 38e6) { toast(`${one.name} is too big: about 28 MB in all`); continue; }
      files.push(one);
    }
    draw();
  };
  pick.onchange = e => { add([...e.target.files]); e.target.value = ""; };
  ta.onpaste = e => { const fs = [...e.clipboardData.files]; if (fs.length) { e.preventDefault(); add(fs); } };
  zone.ondragover = e => e.preventDefault();
  zone.ondrop = e => { e.preventDefault(); add([...e.dataTransfer.files]); };
  return {add, list: () => files.map(({name, data}) => ({name, data})), clear: () => { files.length = 0; draw(); }};
}
const readURL = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); });

// An image as {name, data: a data: URL, img}. Small ones go as they are (screenshots stay sharp); big photos are
// redrawn as JPEG no wider or taller than 2048px. One the browser can't draw (HEIC, say) goes as it is.
async function shrink(f) {
  const name = f.name || `image.${(f.type.split("/")[1] || "png").replace("jpeg", "jpg")}`;
  if (f.size < 1.5e6 && /^image\/(jpeg|png|webp|gif)$/.test(f.type)) return {name, data: await readURL(f), img: true};
  try {
    const bmp = await createImageBitmap(f), k = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    const c = Object.assign(document.createElement("canvas"), {width: Math.round(bmp.width * k), height: Math.round(bmp.height * k)});
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return {name: name.replace(/(\.\w+)?$/, ".jpg"), data: await readURL(await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85))), img: true};
  } catch { return {name, data: await readURL(f)}; }
}

// The phone's bottom bar: which panes sit in it, in what order. appbar.js owns the panes and saving.
async function barSettings() {
  const box = $("#barcfg");
  if (!window.appbar && document.readyState === "loading") await new Promise(r => addEventListener("DOMContentLoaded", r, {once: true}));
  if (!window.appbar) { box.innerHTML = `<p class="muted">Open the app from its main address to set this.</p>`; return; }
  let {panes, main} = window.appbar.layout();
  const draw = () => {
    const row = (p, i) => `<li><b aria-hidden="true">${p.icon}</b><span>${esc(p.name)}</span>
      <button data-up="${i}" ${i ? "" : "disabled"} aria-label="Move ${esc(p.name)} up">↑</button>
      <button data-down="${i}" ${i < panes.length - 1 ? "" : "disabled"} aria-label="Move ${esc(p.name)} down">↓</button></li>`;
    const items = panes.map(row);
    if (panes.length > main + 1) items.splice(main, 0, `<li class="more" aria-hidden="true">⋯ Under More</li>`);
    box.innerHTML = `<p class="muted">The top ones sit in the bar; the rest open from More.</p>
      <div class="stepper"><span>In the bar</span><button id="barless" aria-label="Fewer in the bar" ${main > 1 ? "" : "disabled"}>−</button>
        <output>${main}</output><button id="barmore" aria-label="More in the bar" ${main < Math.min(6, panes.length) ? "" : "disabled"}>+</button></div>
      <ul class="barlist">${items.join("")}</ul><p><button class="btn" id="savebar">Save bar</button></p>`;
    box.querySelectorAll("[data-up],[data-down]").forEach(b => b.onclick = () => {
      const i = +(b.dataset.up ?? b.dataset.down), j = b.dataset.up !== undefined ? i - 1 : i + 1;
      [panes[i], panes[j]] = [panes[j], panes[i]]; draw();
      box.querySelector(`[data-${b.dataset.up !== undefined ? "up" : "down"}="${j}"]`)?.focus();
    });
    $("#barless").onclick = () => { main--; draw(); };
    $("#barmore").onclick = () => { main++; draw(); };
    $("#savebar").onclick = async () => {
      try { await window.appbar.save({order: panes.map(p => p.id), main}); toast("Saved"); } catch (e) { toast(e.message); }
    };
  };
  draw();
}

  clearInterval(timer); lastSig = ""; current = null;
  document.querySelector(".composer")?.remove();
  document.body.ondrop = document.body.ondragover = $("#main").ondrop = $("#main").ondragover = null;  // a page's drop target goes with it
  const h = location.hash.slice(1);
  if (h.startsWith("t=")) return thread(+h.slice(2));
  if (h === "new" || new URLSearchParams(location.search).has("text") || new URLSearchParams(location.search).has("url")) return capture();
  if (h === "settings") return settings();
  home();
}
$("#back").onclick = () => history.length > 1 ? history.back() : (location.hash = "");
$("#gear").onclick = () => location.hash = "settings";
addEventListener("hashchange", route);
// Coming back refreshes a thread or home, never New thread or Settings: on a phone the file picker hides the page,
// and redrawing those threw away what he'd typed and attached.
document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") return;
  if (current) thread(current.id, true); else if (!$("#cap") && location.hash !== "#settings") route(); });
route();
</script>
